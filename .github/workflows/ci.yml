name: CI

on:
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── TypeScript / Turbo monorepo ──────────────────────────────────
  ts:
    name: TypeScript (lint, types, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm run lint
      - run: pnpm run check-types
      - run: pnpm run test

  # ── Solidity / Foundry ───────────────────────────────────────────
  foundry:
    name: Foundry tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/cre-contracts/foundry
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: foundry-rs/foundry-toolchain@v1

      - run: forge build
      - run: forge test -vvv

  # ── Rust services ────────────────────────────────────────────────
  rust:
    name: Rust (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [treasury, user-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: services/${{ matrix.service }}

      - run: cargo fmt --check
      - run: cargo clippy
      - run: cargo test
