syntax = "proto3";
package treasury;

service TreasuryService {
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);

  // Hot path — implemented in Task 05
  rpc GetRelayStatus(GetRelayStatusRequest) returns (GetRelayStatusResponse);

  // Pool management — implemented in Task 05/10
  rpc GetPoolDepth(GetPoolDepthRequest) returns (GetPoolDepthResponse);

  // Watcher — implemented in Task 06
  rpc GetWatcherAlerts(GetWatcherAlertsRequest) returns (GetWatcherAlertsResponse);

  // User-facing queries
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc GetAccountActivity(GetAccountActivityRequest) returns (GetAccountActivityResponse);

  // RouteReceiver-derived activation set (same view the hot-path relayer uses).
  rpc IsChainActive(IsChainActiveRequest) returns (IsChainActiveResponse);
  rpc IsChainDecommissioned(IsChainDecommissionedRequest) returns (IsChainDecommissionedResponse);

  // Per-chain withdrawability: min(balanceOf, reserveDepth) on active chains.
  rpc GetWithdrawalRouting(GetWithdrawalRoutingRequest) returns (GetWithdrawalRoutingResponse);
}

message HealthCheckRequest {}
message HealthCheckResponse {
  enum Status {
    UNKNOWN     = 0;  // proto3 zero value — never returned at runtime
    SERVING     = 1;
    NOT_SERVING = 2;
  }
  Status status          = 1;
  bool   db_connected    = 2;
  bool   rpc_reachable   = 3;
  bool   relayer_key_loaded = 4;
}

message GetRelayStatusRequest  { string source_event_hash = 1; }
message GetRelayStatusResponse { string status = 1; }

message GetPoolDepthRequest    { uint64 chain_id = 1; }
message GetPoolDepthResponse   { string depth_wei = 1; }

message GetWatcherAlertsRequest  { uint32 limit = 1; }
message GetWatcherAlertsResponse { repeated string alert_ids = 1; }

message GetBalanceRequest  { string address = 1; }
message GetBalanceResponse {
  string balance_wei = 1;
  // True when one or more chains used the indexed fallback instead of live balanceOf.
  bool degraded = 2;
}

message GetAccountActivityRequest {
  string address = 1;
  uint32 limit   = 2;
}

message ActivityEntry {
  string kind         = 1;  // deposit | withdrawal | transfer | hot_path
  string direction    = 2;  // incoming | outgoing
  string counterparty = 3;
  uint64 chain_id     = 4;
  string amount_wei   = 5;
  string status       = 6;  // completed | pending | failed
  string tx_hash      = 7;
  string occurred_at  = 8;  // RFC3339 block time when indexed
}

message GetAccountActivityResponse {
  repeated ActivityEntry entries = 1;
}

message IsChainActiveRequest {
  uint64 chain_id = 1;
}
message IsChainActiveResponse {
  bool active = 1;
}

message IsChainDecommissionedRequest {
  uint64 chain_id = 1;
}
message IsChainDecommissionedResponse {
  bool decommissioned = 1;
}

message GetWithdrawalRoutingRequest {
  string address = 1;
}

message WithdrawalRoutingEntry {
  uint64 chain_id        = 1;
  string withdrawable_wei = 2;
  bool   available       = 3;
  // Empty when available; e.g. "chain_inactive" when the chain cannot process txs.
  string reason          = 4;
  // User SyncUSD balance on this chain (before reserve cap).
  string balance_wei     = 5;
}

message GetWithdrawalRoutingResponse {
  repeated WithdrawalRoutingEntry entries = 1;
}
