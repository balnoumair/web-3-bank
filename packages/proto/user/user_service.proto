syntax = "proto3";
package user;

service UserService {
  rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
  rpc GetUserByAddress(GetUserByAddressRequest) returns (GetUserByAddressResponse);
  rpc GetUserByCredentialId(GetUserByCredentialIdRequest) returns (GetUserByCredentialIdResponse);
  rpc ListCredentials(ListCredentialsRequest) returns (ListCredentialsResponse);
  rpc AddCredential(AddCredentialRequest) returns (AddCredentialResponse);
  rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
  rpc RevokeCredential(RevokeCredentialRequest) returns (RevokeCredentialResponse);
  rpc SetUsername(SetUsernameRequest) returns (SetUsernameResponse);
  rpc GetUserByUsername(GetUserByUsernameRequest) returns (GetUserByUsernameResponse);

  // Home chain — set on first deposit (Treasury); read by BFF for hot-path routing.
  rpc GetUserHomeChain(GetUserHomeChainRequest) returns (GetUserHomeChainResponse);
  rpc SetUserHomeChain(SetUserHomeChainRequest) returns (SetUserHomeChainResponse);
}

// credential_id is raw bytes throughout. The BFF must base64url-decode
// the value received from the browser before sending it to this service.
message CreateUserRequest {
  optional string display_name  = 1;  // defaults to "" on server if absent
  bytes           credential_id = 2;  // raw WebAuthn credential ID bytes
  bytes           public_key    = 3;  // raw P-256 public key bytes
  string          tempo_address = 4;  // 0x-prefixed 40-char hex
}
message CreateUserResponse { string user_id = 1; }

message GetUserByAddressRequest { string tempo_address = 1; }
message GetUserByAddressResponse {
  string user_id       = 1;
  string display_name  = 2;
  string status        = 3;
  string tempo_address = 4;
  string username      = 5;  // empty string if not set
}

// credential_id is raw bytes — BFF must base64url-decode before sending.
message GetUserByCredentialIdRequest { bytes credential_id = 1; }
message GetUserByCredentialIdResponse {
  string user_id       = 1;
  string display_name  = 2;
  string status        = 3;
  string tempo_address = 4;
  string username      = 5;  // empty string if not set
}

message ListCredentialsRequest {
  string user_id = 1;
}
message ListCredentialsResponse { repeated Credential credentials = 1; }

// public_key intentionally omitted: Tempo verifies WebAuthn on-chain.
message Credential {
  string credential_id = 1;  // base64url-encoded
  string tempo_address = 2;
  string created_at = 3;
  bool revoked = 4;
}

// user_id injected by BFF from JWT session — never from the client.
message AddCredentialRequest {
  string user_id       = 1;
  bytes  credential_id = 2;
  bytes  public_key    = 3;
  string tempo_address = 4;
}
// credential_id returned as base64url string for direct GraphQL forwarding.
message AddCredentialResponse { string credential_id = 1; }

message UpdateUserRequest {
  string          user_id      = 1;
  optional string display_name = 2;
}
message UpdateUserResponse {
  string user_id      = 1;
  string display_name = 2;
  string username     = 3;  // empty string if not set
}

// user_id injected by BFF from JWT — never from the client.
message SetUsernameRequest {
  string user_id  = 1;
  string username = 2;
}
message SetUsernameResponse {
  string user_id       = 1;
  string display_name  = 2;
  string status        = 3;
  string tempo_address = 4;
  string username      = 5;
}

message GetUserByUsernameRequest {
  string username = 1;
}
message GetUserByUsernameResponse {
  string user_id       = 1;
  string display_name  = 2;
  string status        = 3;
  string tempo_address = 4;
  string username      = 5;
}

message RevokeCredentialRequest {
  string user_id       = 1;
  bytes  credential_id = 2;
}
message RevokeCredentialResponse {
  bool success = 1;
}

message GetUserHomeChainRequest {
  string tempo_address = 1;
}
message GetUserHomeChainResponse {
  bool found = 1;
  uint64 chain_id = 2;
}

message SetUserHomeChainRequest {
  string tempo_address = 1;
  uint64 chain_id = 2;
  // False/default: first-deposit sticky set only. True: Treasury decommission override.
  bool decommission_override = 3;
  string operator = 4;
}
message SetUserHomeChainResponse {}
