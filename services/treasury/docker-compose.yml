version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: web3bank
      POSTGRES_USER: treasury
      POSTGRES_PASSWORD: treasury
    ports:
      - "5432:5432"
    volumes:
      - treasury_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treasury -d web3bank"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  treasury_pgdata:
