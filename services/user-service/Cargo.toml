[package]
name = "user-service"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio        = { version = "1", features = ["full"] }
tonic        = "0.11"
tonic-health = "0.11"
prost        = "0.12"
sqlx         = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "macros"] }
uuid         = { version = "1", features = ["v4"] }
chrono       = "0.4"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
once_cell    = "1"
regex        = "1"
base64       = "0.22"
thiserror    = "1"

[build-dependencies]
tonic-build = "0.11"

[dev-dependencies]
sqlx         = { version = "0.7", features = ["runtime-tokio-native-tls", "postgres", "uuid", "chrono", "macros"] }
tokio-stream = "0.1"
