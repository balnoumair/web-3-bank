# Run from repo root: docker compose -f services/docker-compose.yml up
# Requires a .env file at services/.env — copy from services/.env.example and fill in values
services:
  # ── Services ──────────────────────────────────────────────────────────────────
  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GRPC_ADDR: "0.0.0.0:50051"
    ports:
      - "50051:50051"
    networks:
      - internal

  treasury:
    build:
      context: ..
      dockerfile: services/treasury/Dockerfile
    env_file:
      - treasury/.env
    environment:
      DATABASE_URL: ${DATABASE_URL}
      GRPC_PORT: 50052
      RELAYER_KEY_PATH: /run/secrets/relayer.key
    ports:
      - "50052:50052"
    networks:
      - internal

  bff:
    build:
      context: ..
      dockerfile: services/bff/Dockerfile
    environment:
      PORT: "4000"
      USER_SERVICE_ADDR: "user-service:50051"
      TREASURY_SERVICE_ADDR: "treasury:50052"
    ports:
      - "4000:4000"
    depends_on:
      - user-service
      - treasury
    networks:
      - internal

networks:
  internal:
