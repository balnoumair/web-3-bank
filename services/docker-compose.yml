# Run from repo root: docker compose -f services/docker-compose.yml up
services:
  # ── Databases (one per microservice) ──────────────────────────────────────────
  postgres-user:
    image: cimg/postgres:18.1
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: web3bank_user
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d web3bank_user"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  postgres-treasury:
    image: cimg/postgres:18.1
    environment:
      POSTGRES_USER: treasury
      POSTGRES_PASSWORD: treasury
      POSTGRES_DB: web3bank_treasury
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U treasury -d web3bank_treasury"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - internal

  # ── Services ──────────────────────────────────────────────────────────────────
  user-service:
    build:
      context: ..
      dockerfile: services/user-service/Dockerfile
    environment:
      DATABASE_URL: postgres://postgres:postgres@postgres-user:5432/web3bank_user
      GRPC_ADDR: "0.0.0.0:50051"
    ports:
      - "50051:50051"
    depends_on:
      postgres-user:
        condition: service_healthy
    networks:
      - internal

  treasury:
    build:
      context: ..
      dockerfile: services/treasury/Dockerfile
    env_file:
      - treasury/.env
    environment:
      DATABASE_URL: postgres://treasury:treasury@postgres-treasury:5432/web3bank_treasury
      GRPC_PORT: 50052
      RELAYER_KEY_PATH: /run/secrets/relayer.key
    ports:
      - "50052:50052"
    depends_on:
      postgres-treasury:
        condition: service_healthy
    networks:
      - internal

  bff:
    build:
      context: ..
      dockerfile: services/bff/Dockerfile
    environment:
      PORT: "4000"
      USER_SERVICE_ADDR: "user-service:50051"
      TREASURY_SERVICE_ADDR: "treasury:50052"
    ports:
      - "4000:4000"
    depends_on:
      - user-service
      - treasury
    networks:
      - internal

networks:
  internal:
